name: Release

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xiegaoxiao/zotero-pdf2zh'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: xiegaoxiao/zotero-pdf2zh
    steps:
      - name: Checkout tagged sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('plugin/package.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Server sources
        run: python -m compileall -q server automation/build_release.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        run: cd plugin && npm ci

      - name: Check plugin
        run: cd plugin && npm run lint:check && npm test && npm run build

      - name: Build and verify every Release asset
        run: python automation/build_release.py

      - name: Publish versioned Release with canonical assets
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" artifacts/release/zotero-pdf-2-zh.xpi artifacts/release/server.zip artifacts/release/SHA256SUMS artifacts/release/update.json artifacts/release/update-beta.json --clobber
          gh release edit "$tag" --draft=false --prerelease=false --latest

      - name: Publish Zotero update feeds after XPI is available
        run: |
          if gh release view release >/dev/null 2>&1; then
            gh release upload release artifacts/release/update.json artifacts/release/update-beta.json --clobber
          else
            gh release create release artifacts/release/update.json artifacts/release/update-beta.json --target "$GITHUB_SHA" --title "Zotero update manifests" --notes "Plugin update feeds. Download the XPI and Server from the versioned Release." --prerelease --latest=false
          fi
